<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Platipus IT Portal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <div class="header">

        <img src="images/logo.png" class="logo" alt="Platipus Logo">

        <h1>Platipus IT Portal</h1>

        <p>Fast access to IT services</p>

    </div>

    <div class="cards">

        <div class="card" id="createTicket">

            <div class="icon">🎫</div>

            <div class="content">

                <h2>Create IT Request</h2>

                <p>Create a new support request in YouTrack</p>

            </div>

        </div>

        <div class="card disabled" id="knowledgeBase">

            <div class="icon">📚</div>

            <div class="content">

                <div class="title">

                    <h2>Knowledge Base</h2>

                    <span class="badge">Coming Soon</span>

                </div>

                <p>Documentation & Guides</p>

            </div>

        </div>

        <div class="card disabled" id="contactIT">

            <div class="icon">💬</div>

            <div class="content">

                <div class="title">

                    <h2>Contact IT</h2>

                    <span class="badge">Coming Soon</span>

                </div>

                <p>Get help from IT Department</p>

            </div>

        </div>

    </div>

    <footer>

        Version 1.0<br>

        Powered by IT Department

    </footer>

</div>

<script src="app.js"></script>

</body>

</html>
